[workspace]
resolver = "2"
members = [
  "crates/vela-abi",
  "crates/vela-sys",
  "crates/vela-loader",
  "crates/vela-runtime",
  "crates/vela-fs",
  "crates/vela-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.0.6"

# 低内存机器：关闭增量编译，减少磁盘/内存占用
[profile.dev]
incremental = false

# 统一 lint 策略（PLAN-0.0.3 T3.4）：CI 以 -D warnings 收紧
[workspace.lints.clippy]
missing_safety_doc = "allow" # unsafe 契约用组级/行内 SAFETY 注释表达（见 HOST.md / HostMem）
