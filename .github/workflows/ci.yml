name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check (PLAN-0.0.3 T3.5)
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings
      - name: Host gate (PLAN-0.1.0 T1.4 — runtime/loader/fs must not touch host internals)
        shell: pwsh
        run: |
          $pat = 'vela_sys::windows|NtContinue|CreateProcessW|AddVectoredExceptionHandler|VEH|os::windows|cfg\(windows\)|cfg\(target_os = "windows"\)'
          $hits = Get-ChildItem crates/vela-runtime/src, crates/vela-loader/src, crates/vela-fs/src -Recurse -Filter *.rs |
            Select-String -Pattern $pat
          if ($hits) { $hits; throw "host-internal references leaked into guest-side crates" }
      - name: Build
        run: cargo build --workspace --verbose
      - name: Generate guest images (no prebuilt binaries, PLAN-0.0.2 T4.2)
        run: |
          cargo run -p vela-cli --bin vela-mkhello -- guest/bin/hello
          cargo run -p vela-cli --bin vela-mkguest -- torture guest/bin/torture
          cargo run -p vela-cli --bin vela-mkguest -- tls guest/bin/tls
          cargo run -p vela-cli --bin vela-mkguest -- bench guest/bin/bench
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Setup zig (busybox build)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Setup msys2 (make/gcc/bzip2 for busybox)
        uses: msys2/setup-msys2@v2
        with:
          update: false
          path-type: inherit
          install: make gcc bzip2 curl
      - name: Build busybox subset (musl cross toolchain)
        shell: msys2 {0}
        run: bash tools/build-busybox.sh
      - name: ash diagnostics (PLAN-0.1.0 T3.1 — UD1 repro artifacts)
        run: |
          cargo run -p vela-cli --bin vela -- run --soft-tls -v guest/bin/busybox sh -c "echo hello | wc -c" 2> sh-trace.log || true
          Get-Content sh-trace.log -Tail 3
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox echo applet-ok
      - name: ash shell acceptance (PLAN-0.1.0 T3.3/T3.4 — failure fails CI)
        run: |
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox sh -c 'echo hello | wc -c'
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox sh -c 'echo $(echo ok)'
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox sh -c 'a=b; echo $a'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\ash-root" | Out-Null
          cargo run -p vela-cli --bin vela -- run --soft-tls --root "$env:RUNNER_TEMP\ash-root" guest/bin/busybox sh -c 'echo x > /tmp/t && cat /tmp/t'
      - name: upload ash artifacts (busybox ELF + trace)
        uses: actions/upload-artifact@v4
        with:
          name: ash-ud1
          path: |
            guest/bin/busybox
            sh-trace.log
          if-no-files-found: warn
      - name: Guest acceptance (spec 9.4, freshly generated images)
        run: |
          cargo run -p vela-cli --bin vela -- run guest/bin/hello
          cargo run -p vela-cli --bin vela -- run guest/bin/torture
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/hello-dyn
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/fs-exec
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/fork-test
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox echo hello
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox nproc
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/busybox true
      - name: Doctor report (informational)
        run: cargo run -p vela-cli --bin vela -- doctor
