name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check (PLAN-0.0.3 T3.5)
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Generate guest images (no prebuilt binaries, PLAN-0.0.2 T4.2)
        run: |
          cargo run -p vela-cli --bin vela-mkhello -- guest/bin/hello
          cargo run -p vela-cli --bin vela-mkguest -- torture guest/bin/torture
          cargo run -p vela-cli --bin vela-mkguest -- tls guest/bin/tls
          cargo run -p vela-cli --bin vela-mkguest -- bench guest/bin/bench
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Setup zig (busybox build)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Setup msys2 (make/gcc for busybox)
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: make gcc
      - name: Build busybox subset (musl static via zig)
        shell: msys2 {0}
        run: bash tools/build-busybox.sh
      - name: Guest acceptance (spec 9.4, freshly generated images)
        run: |
          cargo run -p vela-cli --bin vela -- run guest/bin/hello
          cargo run -p vela-cli --bin vela -- run guest/bin/torture
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/hello-dyn
          cargo run -p vela-cli --bin vela -- run --soft-tls guest/bin/fs-exec
          cargo run -p vela-cli --bin vela -- run guest/bin/busybox echo hello
          cargo run -p vela-cli --bin vela -- run guest/bin/busybox nproc
          cargo run -p vela-cli --bin vela -- run guest/bin/busybox true
      - name: Doctor report (informational)
        run: cargo run -p vela-cli --bin vela -- doctor
